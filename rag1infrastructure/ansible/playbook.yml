- name: Elasticsearch
  hosts: elasticsearch
  become: true
  roles:
    - role: dmytrokrynytsyn.components.elasticsearch

- name: Fluentd
  hosts: fluentd
  become: true
  roles:
    - role: dmytrokrynytsyn.components.fluentd
      vars:
        elasticsearch_host: "{{ hostvars[inventory_hostname]['elasticsearch_ip'] }}"

- name: Kibana
  hosts: kibana
  become: true
  roles:
    - role: dmytrokrynytsyn.components.kibana
      vars:
        elasticsearch_host: "{{ hostvars[inventory_hostname]['elasticsearch_ip'] }}"

- name: Prometheus
  hosts: prometheus
  become: true
  roles:
    - role: dmytrokrynytsyn.components.prometheus
      vars:
        nodes_to_srcape: "{{ hostvars[inventory_hostname]['nodes_to_scrape']}}"

- name: Grafana
  hosts: grafana
  become: true
  roles:
    - role: dmytrokrynytsyn.components.grafana
      vars:
        prometheus_ip: "{{ hostvars[inventory_hostname]['prometheus_ip'] }}"

- name: Configure Vector DB
  hosts: vectordb
  become: true
  roles:
    - role: dmytrokrynytsyn.components.milvusdb

- name: Configure RAG backend service
  hosts: backend
  become: true

  tasks:
    - name: Pull Docker image
      community.docker.docker_image:
        name: dkrinitsyn/rag1backend:latest
        tag: latest
        source: pull
        force_source: true

    - name: Run Docker container
      community.docker.docker_container:
        name: rag1backend_container
        image: dkrinitsyn/rag1backend:latest
        state: started
        ports:
          - "80:80"
        env:
          VECTORDB_IP: "{{ hostvars[inventory_hostname]['vectordb_ip'] }}"
          OPEN_API_KEY: "{{ hostvars[inventory_hostname]['open_api_key'] }}"
          REDIS_IP: "{{ hostvars[inventory_hostname]['redis_primary_host'] }}"
          KAFKA_CONNECTION_STRING: "{{ hostvars[inventory_hostname]['kafka_connection_string'] }}"

- name: Configure RAG frontend service
  hosts: frontend
  become: true

  tasks:
    - name: Pull Docker image
      community.docker.docker_image:
        name: dkrinitsyn/rag1frontend
        tag: latest
        source: pull
        force_source: true

    - name: Run Docker container
      community.docker.docker_container:
        name: rag1frontend_container
        image: dkrinitsyn/rag1frontend:latest
        state: started
        env:
          SLACK_BOT_TOKEN: "{{ hostvars[inventory_hostname]['slack_bot_token'] }}"
          SLACK_APP_TOKEN: "{{ hostvars[inventory_hostname]['slack_app_token'] }}"
          DEFAULT_CHANNEL: "{{ hostvars[inventory_hostname]['default_channel'] }}"
          RAG_BACKEND_IP: "{{ hostvars[inventory_hostname]['backend_ip'] }}"
          KAFKA_CONNECTION_STRING: "{{ hostvars[inventory_hostname]['kafka_connection_string'] }}"
