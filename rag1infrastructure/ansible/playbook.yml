---
- name: For all instances
  hosts: all
  become: true

  tasks:
    - name: Initial update yum cache
      yum:
        update_cache: true

    - name: Add initial dependencies
      yum:
        name: 
          - awscli
          - tree
        state: present

  roles:
    - role: dmytrokrynytsyn.components.fluentbit
      vars:
        fluentd_host: "{{ hostvars[inventory_hostname]['fluentd_ip'] }}"
    - role: dmytrokrynytsyn.components.node_exporter

- name: Docker
  hosts: frontend, backend, vectordb
  become: true
  roles:
    - role: dmytrokrynytsyn.components.docker

- name: Kafka cluster
  hosts: kafka
  become: true
  roles:
    - role: dmytrokrynytsyn.components.kafka_broker

